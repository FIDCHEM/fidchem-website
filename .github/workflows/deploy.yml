# GitHub Actions deploy is DISABLED — Cloudflare Pages deploys automatically
# via its native GitHub integration (configured in the Cloudflare Pages dashboard).
# This file is kept only as a reference.
#
# To re-enable: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repo secrets
# and restore the 'push' trigger below.

name: Deploy to Cloudflare Pages (manual only)

on:
  workflow_dispatch:  # only runs when triggered manually from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: fidchem-web
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
